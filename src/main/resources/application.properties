spring.application.name=chat
server.port=8080

# Defaults target a local Postgres (e.g. `docker compose up -d db`);
# docker-compose overrides these via environment variables for the app container.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chat}
spring.datasource.username=${DB_USER:chat}
spring.datasource.password=${DB_PASSWORD:chat}

# schema.sql is idempotent (CREATE ... IF NOT EXISTS), so running it on every start is safe
# and avoids pulling in a migration tool for an MVP.
spring.sql.init.mode=always
# schema.sql owns the schema; Hibernate only maps onto it and never generates DDL.
spring.jpa.hibernate.ddl-auto=none
# No lazy relations to load in views, and a request-wide EntityManager would be left
# unusable after the constraint-violation retry in findOrCreate / saveIdempotent.
spring.jpa.open-in-view=false

# Lets error reasons (e.g. "Missing or unknown X-User-Id") reach the UI.
server.error.include-message=always
